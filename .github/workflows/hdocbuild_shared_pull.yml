name: Shared workflow for validating pull requests

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      server_url:
        required: true
        type: string
      repo:
        required: true
        type: string
      run_id:
        required: true
        type: string
  
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    
      # Setup NodeJS Active LTS (24 currently)
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '24.17.x'

      # Checkout fork PR code for validation.
      # allow-unsafe-pr-checkout: true is set because this workflow is triggered via pull_request_target
      # (required so GITHUB_TOKEN can close rejected PRs), which causes actions/checkout@v7+ to block
      # fork code checkout by default as a "pwn request" guard.
      #
      # Risk assessment: acceptable here because:
      #   - Fork content is treated as data only; no fork scripts are executed
      #   - hdoc-tools is installed from the npm registry, not from the PR
      #   - hdoc validate only reads markdown/config files, it does not execute fork code
      #   - No auto-merge is in place; a human must review and approve all PRs
      #   - GITHUB_TOKEN expires at end of workflow run and is scoped to this repo only
      #   - Attacker cannot approve their own PR (GitHub blocks self-approval)
      - name: Checkout For Push or Workflow Dispatch
        uses: actions/checkout@v7.0.0
        with:
           ref: ${{ inputs.branch }}
           fetch-depth: 0
           allow-unsafe-pr-checkout: true
      
      # Install hdoc-tools globally
      - name: Install hdoc-tools
        run: npm install hdoc-tools -g
     
     # Run hdoc validate against checked-out content
      - name: Perform Validation
        id: hdocbuild
        run: |
          if result=`hdoc validate 2>&1`; then
              printf "Build Success!\n\n"
              printf "$result"
              exit 0
          else
            #valout=$(echo "$result" | awk '/Validation Output/,0')
            printf "Build Failed!\n\n-----------------------\n"
            printf "$result"
            exit 1
          fi

      # If build validation fails, and event trigger was a pull request  then close the pull request
      - name: Reject Pull Request
        if: failure()
        uses: superbrothers/close-pull-request@v3
        with:
          comment: "Your pull request has been rejected as build validation has failed. See the Perform Validation step of the build job for more information: ${{ inputs.server_url }}/${{ inputs.repo }}/actions/runs/${{ inputs.run_id }}"
      
      # If build validation is successful, echo message
      - name: Build Success
        if: success()
        run: echo "::notice::Build validation passed successfully."